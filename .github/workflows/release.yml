name: Build and Release

on:
  workflow_dispatch: # Manual build -> Uploads artifact only
  push:
    tags:
      - "v*.*.*" # Tag push -> Builds & creates Draft Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Assert version match when triggered by a tag push
      - name: Assert version match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(pnpm pkg get version | tr -d '"')
          EXPECTED_VERSION="${GITHUB_REF#refs/tags/}"

          if [ "v$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch! Expected $EXPECTED_VERSION, found v$PACKAGE_VERSION"
            exit 1
          fi

      # Install & Build
      - name: Build extension
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Upload Artifact (Always runs for both triggers)
      - name: Upload compressed zips
        uses: actions/upload-artifact@v4
        with:
          name: built_package
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # Only runs on tag pushes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: built_package
          path: built_package
          merge-multiple: true

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "built_package/*.zip"
          draft: true
